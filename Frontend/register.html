
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | User Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 32px;
            border-radius: 12px;
            width: 360px;
            box-shadow: 0 5px 25px #0001;
        }
        h2 { text-align: center; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 7px 0;
            box-sizing: border-box;
        }
        button {
            background: #2563eb;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 6px;
        }
        #message { text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Create Account</h2>

        <form id="registerForm">
            <input name="username" placeholder="Username" required maxlength="50">
            <input name="firstname" placeholder="First Name" required maxlength="50">
            <input name="lastname" placeholder="Last Name" required maxlength="50">
            <input name="salary" type="number" step="0.01" min="0" placeholder="Salary" required>
            <input name="age" type="number" min="0" max="120" placeholder="Age" required>
            <input name="password" type="password" minlength="8" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>

        <p id="message" role="status"></p>
        <p>Already registered? <a href="login.html">Sign in</a></p>
    </div>

    <script src="auth.js"></script>
</body>
</html>
